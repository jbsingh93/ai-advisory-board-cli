name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (node ${{ matrix.node }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:run

      - name: Verify npm tarball contents
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          echo "=== Tarball contents ==="
          node -e "const p = require('/tmp/pack.json'); p[0].files.forEach(f => console.log(f.path));"
          echo "=== Refusing to publish if docs/, tests/, or test-artifacts/ are in the tarball ==="
          node -e "const p = require('/tmp/pack.json'); const bad = p[0].files.filter(f => /^(docs|tests|test-artifacts)\//.test(f.path)); if (bad.length) { console.error('Forbidden files in tarball:', bad.map(f=>f.path)); process.exit(1); }"
