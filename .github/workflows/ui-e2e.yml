name: UI E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel older runs on the same branch to keep CI snappy.
concurrency:
  group: ui-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (node ${{ matrix.node }} · ${{ matrix.os }} · shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest, macos-latest]
        shard: [1, 2, 3, 4]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build aab CLI (needed by Playwright webServer fixture)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest (unit + integration)
        run: npm run test:run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E (shard ${{ matrix.shard }}/4)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}-node${{ matrix.node }}-shard${{ matrix.shard }}
          path: test-artifacts/playwright-test
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.os }}-node${{ matrix.node }}-shard${{ matrix.shard }}
          path: |
            test-artifacts/playwright-test/**/trace.zip
            test-artifacts/playwright-test/**/*.png
            test-artifacts/playwright-test/**/*.webm
          retention-days: 7
          if-no-files-found: ignore
